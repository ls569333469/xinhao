<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>庄家吸筹背离 · 1H观察</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:15px/1.6 system-ui;background:#f5f7fb;color:#172238}header,.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:24px;margin:0;margin-right:auto}a,button,select{color:#2158b6}button,select,a.action{background:white;border:1px solid #cbd5e1;border-radius:7px;padding:8px;cursor:pointer}section{margin-top:18px;background:white;padding:16px;border-radius:12px;box-shadow:0 1px 5px #dfe4ec}.table{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:center;border-bottom:1px solid #e3e8f0;padding:12px}small{display:block;color:#64748b}.muted{color:#64748b}dialog{max-width:min(900px,95vw);width:95vw;border:1px solid #cbd5e1;border-radius:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#b42318}@media(max-width:600px){body{padding:12px}h1{font-size:20px}}
</style><header><h1>庄家吸筹背离 <small>1H独立观察 · 北京时间（UTC+8）</small></h1><a class="action" href="/">返回工作台</a><button id="refresh">刷新</button><button id="maintenance">历史清理设置</button><a class="action" href="/api/b-observe/events.csv">导出CSV</a><a class="action" href="/api/b-observe/report">观察报告</a></header>
<p class="muted">量增价平 → 紧接下一小时确认。观察结果供研究，不代表模拟成交。</p><section><div id="status" role="status">正在读取本地记录…</div><div id="coverage" class="muted"></div><p id="epoch" class="muted"></p><div class="bar"><label>范围 <select id="scope"><option value="all">全部记录</option><option value="forward">前向观察</option><option value="history">历史预热</option></select></label><label>阶段 <select id="stage"><option value="all">全部阶段</option><option>待确认</option><option>完整确认</option><option>结构不满足</option><option>资格待核验</option><option>确认未通过</option><option>确认待核验</option><option>已更正</option><option>旧版待复核</option></select></label><span id="count"></span></div></section>
<section id="cleanupPanel" hidden><p id="cleanupSummary"></p><label><input type="checkbox" id="cleanupEnabled"> 开启普通历史定期清理</label> <div id="retentionFields" class="bar"></div><button id="saveCleanup">保存清理设置</button><p class="muted">当前快照、最近三轮可用快照、事件和研究引用受保护。未知依赖跳过，40GB为预算。</p></section><section class="table"><table><thead><tr><th>合约</th><th>事件收盘</th><th>阶段</th><th>事件 / 确认量比</th><th>理论 / 发现价</th><th>研究止损参考</th><th>记录</th></tr></thead><tbody id="rows"></tbody></table></section><dialog id="detail"><button id="close">关闭详情</button><h2 id="detailTitle"></h2><p>庄家吸筹为策略观察名称。多空比不能证明庄家身份；同期证据、时点和修订见下方。</p><pre id="detailData"></pre></dialog>
<script>
'use strict';let data={events:[]};const $=id=>document.getElementById(id);const fmt=v=>v==null?'未取得':typeof v==='number'?v.toLocaleString('zh-CN',{maximumFractionDigits:6}):String(v);const tm=v=>v?new Date(v).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'未取得';
function render(){const all=data.events||[];const rows=all.filter(r=>($('scope').value==='all'||($('scope').value==='history')===!!r.historical)&&($('stage').value==='all'||r.stage===$('stage').value));$('count').textContent=`当前筛选 ${rows.length} 个事件 / 累计 ${all.length} 个事件；前向 ${data.forward_count||0}，历史 ${data.historical_count||0}`;$('rows').replaceChildren();for(const r of rows){const tr=document.createElement('tr');for(const val of [r.symbol+' · '+r.market,tm(r.trigger_open_time+3600000),r.stage+(r.historical?'（历史）':''),fmt(r.event_ratio)+' / '+fmt(r.confirm_ratio),fmt(r.P_theory)+' / '+fmt(r.P_observed),fmt(r.S0)]){const td=document.createElement('td');td.textContent=val;tr.append(td);}const td=document.createElement('td');const b=document.createElement('button');b.textContent='详情 · r'+r.event_revision;b.onclick=()=>{$('detailTitle').textContent=r.symbol+' · '+r.stage;$('detailData').textContent=JSON.stringify(r,null,2);$('detail').showModal();};td.append(b);tr.append(td);$('rows').append(tr);}if(!rows.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=7;td.textContent='当前筛选暂无事件';tr.append(td);$('rows').append(tr);}}
async function load(){try{const res=await fetch('/api/b-observe/events',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);data=await res.json();const r=data.last_round,s=r?.round_stats||{};$('status').className='';$('status').textContent=r?`最近一轮${r.round_id?'':'（旧版，尚未按r2验收）'}：${({success:'完成',partial_success:'部分完成',failed:'失败'})[r.status]||r.status} · 目标收盘 ${tm(r.target_close_boundary)}`:'尚无观察轮次';$('coverage').textContent=r?`目录 ${s.universe??r.symbols} 份合约 · 已监测 ${s.monitored_symbols??r.evaluated} · 技术可评估 ${s.evaluated_symbols??'未知'} · 预热或缺口 ${s.warmup_or_gap_symbols??'未知'} · 未监测 ${s.unmonitored??'未知'} · 错误 ${s.errors??'未知'}`:'开启观察后记录真实覆盖；页面读取不会触发行情请求。';$('epoch').textContent='观察起点：'+tm(data.observation_started_at);render();}catch(e){$('status').className='error';$('status').textContent='读取失败：'+e.message;}}
$('maintenance').onclick=async()=>{try{const r=await fetch('/api/cache/retention');if(!r.ok)throw Error('读取清理设置失败');const d=await r.json();$('cleanupEnabled').checked=d.settings.enabled;$('retentionFields').replaceChildren();const labels={temp_hours:'临时文件（小时）',debug_days:'调试明细（天）',log_days:'普通日志（天）',raw_api_days:'原始响应（天）',full_snapshot_days:'完整快照（天）',oi_lsr_days:'普通OI/LSR（天）','1h_days':'普通1H K线（天）',backup_days:'备份（天）',backup_min_success:'成功恢复点（至少3）'};for(const [key,value] of Object.entries(d.policy)){const l=document.createElement('label'),i=document.createElement('input');l.textContent=labels[key]||key;i.type='number';i.min=key==='backup_min_success'?3:1;i.max=3650;i.value=value;i.dataset.retention=key;i.style.width='85px';l.append(i);$('retentionFields').append(l);}$('cleanupSummary').textContent=`当前占用 ${(d.capacity.total_bytes/1024**3).toFixed(2)} GB / 40 GB`;$('cleanupPanel').hidden=!$('cleanupPanel').hidden;}catch(e){$('status').textContent=e.message;}};
$('saveCleanup').onclick=async()=>{try{const r=await fetch('/api/cache/retention',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:$('cleanupEnabled').checked,retention:Object.fromEntries([...document.querySelectorAll('[data-retention]')].map(i=>[i.dataset.retention,Number(i.value)]))})});if(!r.ok)throw Error('保存失败');$('cleanupSummary').textContent='清理设置已保存';}catch(e){$('cleanupSummary').textContent=e.message;}};
$('refresh').onclick=load;$('scope').onchange=render;$('stage').onchange=render;$('close').onclick=()=>$('detail').close();load();
</script></html>
